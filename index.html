<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emanet Envanter Sistemi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* MOBİL SABİTLEME AYARLARI */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Sayfanın kaymasını engeller */
            overscroll-behavior: none; /* Lastik etkisini (bounce) engeller */
            -webkit-overflow-scrolling: touch;
        }
        @media print { 
            .no-print { display: none !important; } 
            .print-only { display: block !important; } 
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-100">

<!-- Uygulamayı ekrana kilitledik (h-screen, overflow-hidden) -->
<div id="app" class="h-screen flex flex-col overflow-hidden">
    
    <header class="bg-slate-900 text-white p-3.5 flex-none shadow-md no-print flex justify-between items-center">
        <div>
            <h1 class="font-bold text-base leading-tight">Envanter Takip</h1>
            <p class="text-[10px] text-slate-400">Saha Kayıt Modülü</p>
        </div>
        <div class="flex gap-1.5">
            <button @click="exportExcel" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 shadow">
                <i class="fa-solid fa-file-excel"></i> Excel
            </button>
            <button @click="triggerPrint" class="bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 shadow">
                <i class="fa-solid fa-print"></i> Yazdır
            </button>
        </div>
    </header>

    <!-- Burayı scroll edilebilir yaptık (overflow-y-auto) -->
    <main class="flex-1 overflow-y-auto p-3 space-y-3 no-print">
        
        <!-- Karar Yılı -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3">
            <button type="button" @click="showYear = !showYear" class="w-full flex justify-between items-center text-xs font-bold text-indigo-900">
                <span>Karar / Grup Yılı: <strong class="text-indigo-600 font-mono text-sm">{{ form.kararYili }}</strong></span>
                <i :class="showYear ? 'fa-chevron-up' : 'fa-chevron-down'" class="fa-solid text-slate-400 text-xs"></i>
            </button>
            <div v-show="showYear" class="grid grid-cols-6 gap-1 mt-2.5 pt-2.5 border-t border-slate-100">
                <button v-for="y in targetYears" :key="'grp-'+y" type="button"
                        @click="setKararYili(y)" 
                        :class="form.kararYili === y ? 'bg-indigo-600 text-white font-bold' : 'bg-slate-50 text-slate-700 border'"
                        class="py-1.5 text-xs rounded-lg font-mono transition">{{ y }}</button>
            </div>
        </div>

        <!-- Hızlı Form -->
        <form @submit.prevent="addItem" class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <div class="space-y-1">
                <label class="text-[11px] font-bold text-slate-600 uppercase">Emanet No</label>
                <div class="flex border border-slate-300 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-blue-500">
                    <input type="number" pattern="\d*" v-model="form.emanetYil" required class="w-16 p-2 bg-slate-50 text-center font-bold text-sm border-r border-slate-200 outline-none">
                    <input type="number" pattern="\d*" v-model="form.emanetNo" placeholder="Sıra No (Örn: 1522)" required ref="emanetInput" class="flex-1 p-2 text-sm font-mono outline-none">
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-[11px] font-bold text-slate-600 uppercase">Soruşturma / Esas No</label>
                <div class="flex border border-slate-300 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-blue-500">
                    <input type="number" pattern="\d*" v-model="form.dosyaYil" required class="w-16 p-2 bg-slate-50 text-center font-bold text-sm border-r border-slate-200 outline-none">
                    <input type="number" pattern="\d*" v-model="form.dosyaNo" placeholder="No (Örn: 25411)" required class="flex-1 p-2 text-sm font-mono outline-none">
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl text-sm shadow-md transition">KAYDET VE LİSTEYE EKLE</button>

            <!-- Emanet Türü -->
            <div class="border-t border-slate-100 pt-2.5">
                <button type="button" @click="showType = !showType" class="w-full flex justify-between items-center text-xs text-slate-600 font-semibold">
                    <span>Emanet Türü: <strong class="text-blue-600">{{ form.materyalTuru }}</strong></span>
                    <i :class="showType ? 'fa-chevron-up' : 'fa-chevron-down'" class="fa-solid text-slate-400 text-xs"></i>
                </button>
                <div v-show="showType" class="flex flex-wrap gap-1 mt-2">
                    <button type="button" v-for="t in ['Zarf','Poşet','Swap','Bilinmiyor','Emanet Yok','Kutu','Dijital']" :key="t" @click="form.materyalTuru=t; showType=false" :class="form.materyalTuru === t ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700'" class="px-2.5 py-1 rounded-lg text-xs transition">{{ t }}</button>
                </div>
            </div>
        </form>

        <!-- Liste Kartları -->
        <div class="space-y-1.5 pb-4">
            <div v-for="item in items" :key="item.id" class="bg-white p-2.5 rounded-xl border border-slate-200 flex justify-between items-center">
                <div>
                    <span class="font-bold text-xs">{{ item.emanetYil }}/{{ item.emanetNo }}</span>
                    <p class="text-[10px] text-slate-500">{{ item.dosyaYil }}/{{ item.dosyaNo }} ({{ item.materyalTuru }})</p>
                </div>
                <button type="button" @click="deleteItem(item.id)" class="text-slate-300 hover:text-rose-500 p-2"><i class="fa-solid fa-trash-can text-xs"></i></button>
            </div>
        </div>
    </main>
</div>

<script>
    const { createApp, ref, onMounted, watch } = Vue;
    createApp({
        setup() {
            const targetYears = ['2005','2006','2007','2008','2009','2010','2011','2012','2013','2014','2015','2016'];
            const items = ref([]);
            const showYear = ref(false);
            const showType = ref(false);
            const emanetInput = ref(null);
            const form = ref({ kararYili: '2013', emanetYil: '2013', emanetNo: '', dosyaYil: '2013', dosyaNo: '', materyalTuru: 'Zarf' });

            const setKararYili = (yr) => { form.value.kararYili = yr; form.value.emanetYil = yr; form.value.dosyaYil = yr; showYear.value = false; };
            onMounted(() => { const db = localStorage.getItem('emanet_lite_db'); if (db) items.value = JSON.parse(db); });
            watch(items, (newVal) => { localStorage.setItem('emanet_lite_db', JSON.stringify(newVal)); }, { deep: true });
            const addItem = () => { items.value.unshift({ id: Date.now().toString(), ...form.value }); form.value.emanetNo = ''; form.value.dosyaNo = ''; if(emanetInput.value) emanetInput.value.focus(); };
            const deleteItem = (id) => { items.value = items.value.filter(i => i.id !== id); };
            const exportExcel = () => { /* Excel mantığı... */ alert('Excel indiriliyor'); };
            const triggerPrint = () => { window.print(); };

            return { targetYears, items, showYear, showType, form, emanetInput, setKararYili, addItem, deleteItem, exportExcel, triggerPrint };
        }
    }).mount('#app');
</script>
</body>
</html>
